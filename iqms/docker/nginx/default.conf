# Top-level reverse proxy: single entry point on :80 that routes
# /api/* to the backend service and everything else to the frontend
# service. Used only by the docker-compose "proxy" service.

upstream backend_upstream {
    server backend:8080;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api-docs/ {
        proxy_pass http://backend_upstream/api-docs/;
    }

    location /swagger-ui/ {
        proxy_pass http://backend_upstream/swagger-ui/;
    }

    location / {
        proxy_pass http://frontend_upstream/;
        proxy_set_header Host $host;
    }
}
