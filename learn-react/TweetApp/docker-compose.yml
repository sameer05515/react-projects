version: '3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:27017/mongodb_test
      - PORT=3003
      - REACT_PORT=3002
    # depends_on:
    #   - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      - PORT=3002
      - BACKEND_APPLICATION_BASE_URL=http://127.0.0.1:3003

