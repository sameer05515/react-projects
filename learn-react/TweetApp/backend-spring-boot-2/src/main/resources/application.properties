# Server Configuration
server.port=3006

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/mongodb_test
spring.data.mongodb.auto-index-creation=true

# Application Configuration
spring.application.name=TweetApp Spring Boot 2 Backend

# CORS Configuration
# Allowed origins - comma-separated list of frontend URLs
# React (default: 3000), Vue (default: 5174), Angular (default: 4200), and other common ports
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:4200,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:4200,http://127.0.0.1:5174
# Allowed HTTP methods
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
# Allowed headers (* for all headers)
spring.web.cors.allowed-headers=*
# Allow credentials (cookies, authorization headers)
spring.web.cors.allow-credentials=true
# Max age for preflight requests (in seconds)
spring.web.cors.max-age=3600

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging Configuration
logging.level.com.tweetapp=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs-json
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.enabled=true

# Thymeleaf Configuration (for Redoc)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

