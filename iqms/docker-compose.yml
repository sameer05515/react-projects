name: iqms

services:

  mysql:
    image: mysql:8.4
    container_name: iqms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-iqms_db}
      MYSQL_USER: ${DB_USERNAME:-iqms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-iqms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [iqms-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: iqms-redis
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-}
      --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [iqms-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-iqms_db}
      DB_USERNAME: ${DB_USERNAME:-iqms_user}
      DB_PASSWORD: ${DB_PASSWORD:-iqms_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8080:8080"
    networks: [iqms-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: iqms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks: [iqms-net]

  proxy:
    image: nginx:1.27-alpine
    container_name: iqms-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [iqms-net]

networks:
  iqms-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
